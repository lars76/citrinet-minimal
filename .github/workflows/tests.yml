name: tests

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/torch/hub/checkpoints
          key: citrinet-checkpoints-v1
      - run: uv venv
      - if: runner.os == 'Linux'
        run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install torch soundfile pyyaml soxr pytest
      - run: uv run python -c "import platform, torch; print(platform.platform(), torch.__version__, 'mkldnn', torch.backends.mkldnn.is_available())"
      - run: uv run pytest -q
